[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpatch-backend"
version = "0.1.0"
description = "Autonomous Bug Fixing With Verifiable Evidence - Backend Orchestrator"
readme = "README.md"
authors = [{ name = "Vaibhav Soni", email = "vaibhavsoni280506@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "contree-sdk>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Pytest Suite
        env:
          PROOFPATCH_MODE: "demo"
          DATABASE_URL: "sqlite:///:memory:"
          LOG_LEVEL: "INFO"
        run: |
          pytest backend/tests -v --durations=10

  frontend-test:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Vitest Frontend Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Production Container Build & Health Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: |
          docker build -t proofpatch:ci -f Dockerfile .

      - name: Verify Container Health Check & Startup
        run: |
          docker run -d --name proofpatch-ci -p 8000:8000 -e PROOFPATCH_MODE=demo proofpatch:ci
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8000/api/health
          docker stop proofpatch-ci
          docker rm proofpatch-ci
